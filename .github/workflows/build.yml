name: Build

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'verification' }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'PR metadata' || 'Build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changes
        id: changes
        run: python3 .github/scripts/classify_changes.py
      - name: Test CI routing
        if: steps.changes.outputs.ci == 'true'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Validate workflows and release metadata
        if: steps.changes.outputs.ci == 'true'
        run: bash .github/scripts/check-workflows.sh
      - name: Set up Java
        if: steps.changes.outputs.heavy == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Gradle
        if: steps.changes.outputs.heavy == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify the legacy Java project
        if: steps.changes.outputs.heavy == 'true'
        run: ./gradlew check assemble --no-daemon
